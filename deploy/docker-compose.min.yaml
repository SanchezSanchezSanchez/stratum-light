version: '3.8'

services:
  # Main STRATUM_LIGHT API service
  stratum-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: stratum-light:latest
    container_name: stratum-api
    restart: unless-stopped
    command: --api
    ports:
      - "8000:8000"
    volumes:
      - stratum-logs:/app/logs
      - stratum-data:/app/data
    env_file:
      - ../.env.production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - API_PORT=8000
      - API_HOST=0.0.0.0
    networks:
      - stratum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # CLI service for scheduled tasks
  stratum-cli:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: stratum-light:latest
    container_name: stratum-cli
    restart: unless-stopped
    command: --cli
    volumes:
      - stratum-logs:/app/logs
      - stratum-data:/app/data
    env_file:
      - ../.env.production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    networks:
      - stratum-network
    depends_on:
      - stratum-api

  # Telemetry service
  stratum-telemetry:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: stratum-light:latest
    container_name: stratum-telemetry
    restart: unless-stopped
    command: --telemetry
    volumes:
      - stratum-logs:/app/logs
      - stratum-telemetry:/app/telemetry
    env_file:
      - ../.env.production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    networks:
      - stratum-network
    depends_on:
      - stratum-api

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: stratum-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - stratum-network
    depends_on:
      - stratum-api

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: stratum-grafana
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - stratum-network
    depends_on:
      - prometheus

volumes:
  stratum-logs:
    driver: local
  stratum-data:
    driver: local
  stratum-telemetry:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  stratum-network:
    driver: bridge

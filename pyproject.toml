[project]
name = "stratum-light"
version = "1.0.0"
description = "LLM Security & Robustness Framework"
requires-python = ">=3.10"
dependencies = [
    "fastapi", "uvicorn", "pydantic", "python-dotenv", "cryptography",
    "PyYAML", "requests", "click", "rich", "psutil"
]

[project.scripts]
stratum-light = "stratum_light_launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
[Project metadata for installable package]
